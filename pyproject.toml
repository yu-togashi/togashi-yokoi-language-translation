[tool.poetry]
name = "togashi-yokoi-language-translation"
version = "0.1.0"
description = "Research project: togashi-yokoi-language-translation"
authors = ["Lab Member <you@example.edu>"]
readme = "README.md"
packages = [{include = "src", from = "code"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
scipy = "^1.12"
matplotlib = "^3.8"
seaborn = "^0.13"
pandas = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^24.0"
ruff = "^0.3"
mypy = "^1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
