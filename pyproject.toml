[tool.poetry]
name = "togashi-yokoi-language-translation"
version = "0.1.0"
description = "Research project: togashi-yokoi-language-translation"
authors = ["Yu Togashi"]
readme = "README.md"
packages = [{include = "localgw", from = "code"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "^1.26"
scipy = "^1.12"
matplotlib = "^3.8"
seaborn = "^0.13"
pandas = "^2.2"
tqdm = "*"
scikit-learn = "*"
# GWTune (submodule, imported via sys.path) requirements
pot = "0.9.4"
optuna = ">=3.2.0"
sqlalchemy = "^2.0"
sqlalchemy-utils = "0.41.1"
pymysql = "*"
umap-learn = "*"
torch = {version = "2.7.1", source = "pytorch-cu128"}
tabulate = "^0.10.0"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^24.0"
ruff = "^0.3"
mypy = "^1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
